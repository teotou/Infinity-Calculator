  .container{max-width:960px;margin:0 auto}
  header{text-align:center;margin-bottom:1.2rem;padding-bottom:.6rem}
  h1{font-family:'Silkscreen',monospace;font-size:clamp(1.5rem,5vw,2.4rem);color:var(--panel-dark);font-weight:700;letter-spacing:-0.02em;-webkit-text-stroke:2px var(--accent);paint-order:stroke fill;text-shadow:0 2px 6px rgba(0,0,0,0.6)}
  .sub{font-size:.88rem;color:var(--text-light);opacity:.95;margin-top:.2rem;font-weight:700;-webkit-text-stroke:1px var(--accent-dark);paint-order:stroke fill;text-shadow:0 1px 4px rgba(0,0,0,0.7)}

  /* Panel */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem;box-shadow:var(--shadow);position:relative}
  .panel.dark{background:var(--panel-dark);border-color:var(--panel-dark);color:var(--text-light)}

  /* Section label */
  .sl{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--panel-dark);font-weight:700;margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
  .sl.dim{color:var(--text-dim);font-weight:700}
  .panel.dark .sl{color:var(--text-light)}

  /* Forms */
  input,select{background:#fff;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'Pixelify Sans',monospace;font-size:.88rem;padding:.45rem .65rem;outline:none;width:100%;font-weight:700;transition:border-color .15s}
  input:focus,select:focus{border-color:var(--panel-dark)}

  @keyframes over9000-pulse{0%,100%{box-shadow:0 0 8px #6ee88a,0 0 16px #6ee88a55}50%{box-shadow:0 0 16px #6ee88a,0 0 28px #6ee88a99,0 0 40px #6ee88a55}}

  .sla{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-light-dim);margin-top:.2rem;font-weight:700}

  .caret.open{transform:rotate(90deg)}
  .cs{padding:.18rem 0;display:flex;justify-content:space-between;gap:.4rem;align-items:center}
  .cs .rd{color:var(--c-lightning);font-size:.74rem;font-weight:700}
  .cd{text-align:center;font-size:.6rem;letter-spacing:.1em;color:var(--text-light-dim);opacity:.8;padding:.3rem 0;text-transform:uppercase;font-weight:700}
  .cre{color:var(--accent-light);font-weight:700;background:rgba(244,184,48,0.15);padding:.18rem .4rem;margin:.1rem -.4rem;border-radius:4px}

  /* Misc */
  .empty{text-align:center;padding:.8rem;color:var(--text-dim);font-style:italic;opacity:.6;font-size:.85rem}
  .opt-item{display:grid;grid-template-columns:55px 1fr;gap:.45rem;align-items:center;padding:.35rem .55rem;background:#fdf8e8;border:1px solid var(--border);border-radius:8px;font-size:.85rem;margin-bottom:.2rem}

  @media(max-width:560px){.gear-grid{grid-template-columns:1fr}.shrine-opts{grid-template-columns:1fr}}
</style>

<body>
<div class="container">
<header><h1>Infinity Calculator</h1><div class="sub">Sword &amp; Supper · Gear + Vending Machine Optimizer</div></header>

<!-- COMBAT SIM + OPTIMIZER (merged) -->
<div class="panel" style="border-color:var(--accent-dark);border-width:2px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.6rem;flex-wrap:wrap">
    <div class="sl" style="margin:0">Viable Builds</div>
  </div>
  <div id="buildsList"><div class="empty" style="padding:1.5rem;text-align:center;color:var(--text-dim);font-style:italic">Set your vending machines below, then click Find Builds.</div></div>
</div>

<!-- VENDING MACHINE PLANNER -->
<div class="panel">
  <div style="display:flex;justify-content:flex-start;align-items:center;gap:1rem;margin-bottom:.5rem;flex-wrap:wrap">
    <button class="btn btn-gold" onclick="optimize()" style="font-size:1.05rem;padding:.7rem 2rem;font-weight:700;letter-spacing:.02em">⚔ Find Builds</button>
    <label style="display:flex;align-items:center;gap:.3rem;cursor:pointer;font-size:.78rem;color:var(--text-dim);font-weight:700"><input type="checkbox" id="noviceMode" style="width:auto;accent-color:var(--c-knife)"> No legacy items</label>
    <label style="display:flex;align-items:center;gap:.3rem;cursor:pointer;font-size:.78rem;color:var(--text-dim);font-weight:700" title="Avoid abilities that fail if attack misses (knife on-hit only, lightning on-hit is safe)"><input type="checkbox" id="avoidNoHit" style="width:auto;accent-color:var(--c-lightning)"> Dodge-safe</label>
  </div>
  <div id="shrinePlanner"></div>
</div>

<!-- GEAR CHECKER -->
<div class="panel">
  <div class="sl collapsible-header" style="cursor:pointer;margin:0" onclick="document.getElementById('gearCheckerBody').classList.toggle('collapsed');this.querySelector('.caret').classList.toggle('open')">🔧 Check Your Gear <span class="caret">▸</span></div>
  <div id="gearCheckerBody" class="collapsible-content collapsed">
    <div style="font-size:.78rem;color:var(--text-dim);font-weight:700;margin:.4rem 0 .7rem">Pick your own gear to test if it works with your vending machines. Updates automatically.</div>
    <div class="gear-grid" id="checkerGrid"></div>
    <div id="checkerResult" style="margin-top:.8rem"></div>
  </div>
</div>
</div>

<script>
const MAX_RAGE=100,BASE_RAGE=25;
const SLOTS=[{id:'helm',name:'Helm',icon:'🪖'},{id:'chest',name:'Chest',icon:'🛡'},{id:'neck',name:'Neck',icon:'🔱'},{id:'weapon',name:'Weapon',icon:'⚔'},{id:'ring',name:'Ring',icon:'💍'},{id:'belt',name:'Belt',icon:'👑'}];

const ABILITIES=[
  {key:'rage_on_heal',name:'R on H',trigger:'heal',effect:'rage',defR:10},
  {key:'rage_on_hit_5',name:'R on hit 5',trigger:'hit',effect:'rage',defR:25,hitN:5},
  {key:'rage_on_lightning',name:'R on L',trigger:'lightning',effect:'rage',defR:10},
  {key:'rage_on_magic_knife',name:'R on mK',trigger:'magic_knife',effect:'rage',defR:5},
  {key:'bonus_rage_on_attack',name:'+R on atk',trigger:'passive',effect:'extra_base_rage',defR:10},
  {key:'rage_on_first_turn',name:'R on 1st turn',trigger:'first_turn',effect:'rage',defR:50},
  {key:'rage_on_kill',name:'R on kill',trigger:'kill',effect:'rage',defR:20},
  {key:'every_other_add_rage',name:'R every other turn',trigger:'turn_count',effect:'rage',defR:10,turnN:2},
  {key:'bolt_on_rage',name:'L on R',trigger:'rage',effect:'lightning'},
  {key:'lightning_on_attack',name:'L on atk',trigger:'attack',effect:'lightning'},
  {key:'lightning_every_5_hits',name:'L every 5 hits',trigger:'hit',effect:'lightning',hitN:5,every:true},
  {key:'lightning_on_hit_4',name:'L on hit 4',trigger:'hit',effect:'lightning',hitN:4},
  {key:'lightning_on_kill',name:'L on kill',trigger:'kill',effect:'lightning'},
  {key:'lightning_on_turn_start',name:'L on turn start',trigger:'turn_start',effect:'lightning'},
  {key:'two_for_two_lightning',name:'2 for 2 L',trigger:'turn_start',effect:'lightning',onlyTurn:2,effCount:2},
  {key:'lightning_on_shield',name:'L on S',trigger:'shield',effect:'lightning'},
  {key:'magic_knife_on_attack',name:'mK on atk',trigger:'attack',effect:'magic_knife'},
  {key:'magic_knife_on_rage',name:'mK on R',trigger:'rage',effect:'magic_knife'},
  {key:'magic_knife_every_3_turns',name:'mK every 3 turns',trigger:'turn_count',effect:'magic_knife',turnN:3},
  {key:'magic_knife_on_hit_2',name:'mK on hit 2',trigger:'hit',effect:'magic_knife',hitN:2},
  {key:'magic_knife_on_kill',name:'mK on kill',trigger:'kill',effect:'magic_knife'},
  {key:'heal_on_lightning',name:'H on L',trigger:'lightning',effect:'heal'},
  {key:'heal_on_magic_knife',name:'H on mK',trigger:'magic_knife',effect:'heal'},
  {key:'heal_on_rage',name:'H on R',trigger:'rage',effect:'heal'},
  {key:'heal_on_first_turn',name:'H on 1st turn',trigger:'first_turn',effect:'heal'},
  {key:'heal_on_kill',name:'H on kill',trigger:'kill',effect:'heal'},
  {key:'heal_on_hit_3',name:'H on hit 3',trigger:'hit',effect:'heal',hitN:3},
  {key:'shield_on_kill',name:'S on kill',trigger:'kill',effect:'shield'},
  {key:'shield_on_hit_5',name:'S on hit 5',trigger:'hit',effect:'shield',hitN:5},
  {key:'shield_on_turn_4',name:'S on turn 4',trigger:'turn_count',effect:'shield',turnN:4},
  {key:'shield_on_rage',name:'S on R',trigger:'rage',effect:'shield'},
  {key:'shield_if_low',name:'S if low',trigger:'passive',effect:'none',noImpact:true},
  {key:'crit_up_max_hp',name:'Crit up if max HP',trigger:'passive',effect:'none',noImpact:true},
  {key:'critical_recovery',name:'Critical recovery',trigger:'passive',effect:'none',noImpact:true},
  {key:'low_hp_defence',name:'Low HP def boost',trigger:'passive',effect:'none',noImpact:true},
  {key:'second_wind',name:'Second wind',trigger:'passive',effect:'none',noImpact:true},
  {key:'fill_rage_low_hp',name:'Fill R on low HP',trigger:'passive',effect:'none',noImpact:true},
  {key:'magic_knife_on_turn_start',name:'mK on turn start',trigger:'turn_start',effect:'magic_knife'},
  {key:'poison_cleanse',name:'Poison cleanse',trigger:'passive',effect:'none',noImpact:true},
  {key:'life_steal',name:'Life steal on atk',trigger:'attack',effect:'heal'},
  // Gear-only abilities (not available as shrine options)
  {key:'knife_doubler',name:'Knife doubler',trigger:'passive',effect:'knife_doubler'},
  {key:'strike_twice',name:'Strike twice',trigger:'passive',effect:'strike_twice'},
  {key:'heal_every_2_hits',name:'H every 2 hits',trigger:'hit',effect:'heal',hitN:2,every:true},
  {key:'magic_knife_every_3_hits',name:'mK every 3 hits',trigger:'hit',effect:'magic_knife',hitN:3,every:true},
];
const AB=Object.fromEntries(ABILITIES.map(a=>[a.key,a]));

const ITEM_DB={
  helm:[
    {name:'— No Helm —',abs:[]},
    {name:'Wrathful Visor',abs:[{k:'rage_on_heal',r:10}]},
    {name:'Braveheart Helm',abs:[{k:'heal_on_rage'}]},
    {name:'Storm Helm',abs:[{k:'heal_on_lightning'}]},
    {name:'Spiked Cowl',abs:[{k:'heal_on_magic_knife'}]},
    {name:'Arctic Mantle',abs:[{k:'magic_knife_on_attack'}]},
  ],
  chest:[
    {name:'— No Chest —',abs:[]},
    {name:'Power Vest',abs:[{k:'rage_on_first_turn',r:50}]},
    {name:'Conductive Chestplate',abs:[{k:'heal_on_lightning'},{k:'rage_on_lightning',r:10}]},
    {name:'Battlethirsty Vest',abs:[{k:'rage_on_kill',r:20},{k:'heal_on_rage'}]},
    {name:'Darksteel Plate',abs:[{k:'rage_on_magic_knife',r:5}]},
    {name:'Recovery Vest',abs:[{k:'heal_on_magic_knife'}]},
    {name:'Fury Vest',abs:[{k:'bonus_rage_on_attack',r:10}]},
  ],
  neck:[
    {name:'— No Amulet —',abs:[]},
    {name:'Wizard Sigil',abs:[{k:'bolt_on_rage'}]},
    {name:'Raging Charm',abs:[{k:'heal_on_rage'}]},
    {name:'Deadly Relic',abs:[{k:'heal_on_kill'}]},
    {name:'Ember Droplet',abs:[{k:'magic_knife_on_turn_start'}]},
  ],
  weapon:[
    {name:'— No Weapon —',abs:[]},
    {name:'Vectra Edge EX',abs:[{k:'lightning_on_attack'},{k:'rage_on_lightning',r:10}]},
    {name:"Sower's Lament",abs:[{k:'magic_knife_on_attack'},{k:'shield_on_hit_5'}]},
    {name:'Scarsteel',abs:[{k:'bolt_on_rage'}]},
    {name:'Cursed Naginata',abs:[{k:'heal_every_2_hits'}]},
    {name:'Stone Blade',abs:[{k:'magic_knife_on_rage'}]},
    {name:'Cursed Naginata',abs:[{k:'heal_every_2_hits'}]},
  ],
  ring:[
    {name:'— No Ring —',abs:[]},
    {name:'Inferno Ring',abs:[{k:'rage_on_first_turn',r:50}]},
    {name:'Smiting Ring',abs:[{k:'lightning_on_attack'}]},
    {name:'Ruby Clawed Ring',abs:[{k:'magic_knife_on_rage'}]},
    {name:'Amberfire Ring',abs:[{k:'magic_knife_on_attack'}]},
    {name:'Stacked Signet',abs:[{k:'rage_on_hit_5',r:25}]},
  ],
  belt:[
    {name:'— No Belt —',abs:[]},
    {name:'Seething Sash',abs:[{k:'bonus_rage_on_attack',r:10},{k:'rage_on_first_turn',r:50}]},
    {name:'Stormwrath Belt',abs:[{k:'lightning_on_turn_start'},{k:'lightning_on_kill'}]},
    {name:'Volatile Sash',abs:[{k:'rage_on_heal',r:10}]},
    {name:"Knife Collector's Belt",abs:[{k:'knife_doubler'}]},
    {name:'Stealthslicer Belt',abs:[{k:'magic_knife_every_3_hits'}]},
  ],
};

// State
let equipped={};SLOTS.forEach(s=>equipped[s.id]=null);
let locked={};SLOTS.forEach(s=>locked[s.id]=false);
let shrinePlan=[];

// Icon helpers
function icoFor(eff){
  if(eff==='rage'||eff==='extra_base_rage')return'<span class="ico ico-rage">R</span>';
  if(eff==='lightning')return'<span class="ico ico-lightning">L</span>';
  if(eff==='magic_knife'||eff==='knife_doubler')return'<span class="ico ico-knife ico-mk">MK</span>';
  if(eff==='heal')return'<span class="ico ico-heal">+</span>';
  if(eff==='shield')return'<span class="ico ico-shield"><svg viewBox="0 0 12 14" width="11" height="13" fill="white"><path d="M6 .5L.5 3v4c0 3.3 2.3 5.5 5.5 6.5 3.2-1 5.5-3.2 5.5-6.5V3z"/></svg></span>';
  if(eff==='strike_twice'||eff==='triple_attack')return'<span class="ico ico-atk"><svg viewBox="0 0 14 14" width="11" height="11" fill="white"><path d="M7 1L2 6l2 1-3 6 6-4 1 2L13 1z"/></svg></span>';
  return'<span class="ico ico-def">·</span>';
}
function trigIco(trigger,a){
  if(trigger==='attack')return'<span style="font-size:14px;vertical-align:middle">⚔️</span>';
  if(trigger==='lightning')return'<span class="ico ico-lightning ico-sm">L</span>';
  if(trigger==='magic_knife')return'<span class="ico ico-knife ico-sm">MK</span>';
  if(trigger==='heal')return'<span class="ico ico-heal ico-sm">+</span>';
  if(trigger==='rage')return'<span class="ico ico-rage ico-sm">R</span>';
  if(trigger==='kill')return'💀';
  if(trigger==='first_turn')return'T1';
  if(trigger==='turn_start')return'each turn';
  if(trigger==='hit')return`${a.hitN||'?'} hits`;
  if(trigger==='turn_count')return`${a.turnN||'?'} turns`;
  if(trigger==='passive')return'passive';
  return trigger;
}
function descAb(a){
  const t=AB[a.k];if(!t)return'';
  const val=t.effect==='rage'||t.effect==='extra_base_rage'?`+${a.r||t.defR} `:'';
  const effIco=icoFor(t.effect).replace(/width="24" height="24"/g,'').replace(/width:24px;height:24px/g,'');
  const trig=trigIco(t.trigger,{hitN:a.hitN||t.hitN,turnN:a.turnN||t.turnN});
  return`<span class="ability-tag">${effIco}<span>${val}on ${trig}</span></span>`;
}
function descItem(item){return item.abs.map(descAb).join(' ');}

function descAbText(a){
  const t=AB[a.k];if(!t)return'';
  const val=(t.effect==='rage'||t.effect==='extra_base_rage')?`+${a.r||t.defR} `:'';
  // Use the ability's short name wrapped in brackets to stand out
  return`[${val}${t.name}]`;
}
function descItemText(item){return item.abs.map(descAbText).join(' ');}

// Novice item overrides — lower values for new players
const NOVICE_OVERRIDES={
  'Power Vest':        [{k:'rage_on_first_turn',r:35}],
  'Inferno Ring':      [{k:'rage_on_first_turn',r:30}],
  'Seething Sash':     [{k:'bonus_rage_on_attack',r:10},{k:'rage_on_first_turn',r:30}],
};

function getNoviceMode(){return document.getElementById('noviceMode')?.checked||false;}

function getItemAbs(item){
  if(getNoviceMode()&&NOVICE_OVERRIDES[item.name])return NOVICE_OVERRIDES[item.name];
  return item.abs;
}
function expandAbs(absList){
  return absList.map(a=>{const t=AB[a.k];if(!t)return null;return{name:t.name,trigger:t.trigger,effect:t.effect,rageAmt:a.r||t.defR,hitN:a.hitN||t.hitN,turnN:a.turnN||t.turnN,every:t.every,onlyTurn:t.onlyTurn,effCount:t.effCount,noImpact:t.noImpact};}).filter(Boolean);
}
function getActiveAbilities(){
  const list=[];
  SLOTS.forEach(s=>{
    const n=equipped[s.id];if(!n)return;
    const item=ITEM_DB[s.id].find(i=>i.name===n);if(!item)return;
    list.push(...expandAbs(getItemAbs(item)));
  });
  shrinePlan.forEach((shrine,i)=>{
    const sel=document.getElementById('shrineChoice'+i);
    if(!sel||!sel.value)return;
    const t=AB[sel.value];if(!t)return;
    list.push({name:t.name+' (vending)',trigger:t.trigger,effect:t.effect,rageAmt:t.defR,hitN:t.hitN,turnN:t.turnN,every:t.every,onlyTurn:t.onlyTurn,effCount:t.effCount,noImpact:t.noImpact});
  });
  return list;

// ======== SIMULATION ========
function simTurn(startRage,abs,turnNum,startEHp,enemies,shields,dodgeFirstAtk,enemyMaxHp,ignoreKills,isAOE){
  const byT={attack:[],lightning:[],magic_knife:[],heal:[],rage:[],turn_start:[],first_turn:[],kill:[],hit:[],turn_count:[],shield:[],passive:[]};
  abs.forEach(a=>{if(byT[a.trigger])byT[a.trigger].push(a);});
  let baseR=BASE_RAGE,numBasics=1,knifeDouble=false;
  byT.passive.forEach(a=>{
    if(a.effect==='extra_base_rage')baseR+=a.rageAmt;
    if(a.effect==='strike_twice'&&turnNum%2===0)numBasics=2;
    if(a.effect==='knife_doubler')knifeDouble=true;
  });
  let rage=startRage,eHp=startEHp,eLeft=enemies,sh=shields;
  let ra=0,kills=0,shGained=0,hitCount=0,totalR=0;
  let log=[],steps=0;const SAFETY=1200;
  const maxHp=enemyMaxHp||100;
  const aoeDmgPerRA=Math.floor(maxHp*0.5);
  let aoeDmgDealt=0; // cumulative AOE damage dealt to all enemies

  function dmg(amt){if(eLeft<=0)return;eHp-=amt;while(eHp<=0&&eLeft>0){kills++;eLeft--;log.push({t:'header',a:`💀 Kill (${eLeft} left)`});if(!ignoreKills)byT.kill.forEach(eff);if(eLeft>0)eHp=maxHp;}}
  function dmgAOE(amt){
    if(eLeft<=0)return;
    aoeDmgDealt+=amt;
    eHp-=amt;
    while(eHp<=0&&eLeft>0){
      kills++;eLeft--;
      log.push({t:'header',a:`💀 AOE Kill (${eLeft} left)`});
      if(!ignoreKills)byT.kill.forEach(eff);
      if(eLeft>0)eHp=maxHp-aoeDmgDealt; // next enemy already took prior AOE hits
    }
  }
  const firedOnce=new Set();
  function regHit(){
    hitCount++;
    byT.hit.forEach(a=>{
      const n=a.hitN||5;
      if(a.every){
        if(hitCount%n===0)eff(a);
      }else{
        if(hitCount===n&&!firedOnce.has(a))firedOnce.add(a),eff(a);
      }
    });
  }
  function addR(amt,src){if(steps++>SAFETY)return;const b=rage;rage+=amt;totalR+=Math.max(0,amt);log.push({t:'rage',a:src,d:amt,r:rage});if(b<100&&rage>=100)doRA();}
  function eff(a){
    if(steps++>SAFETY||a.noImpact)return;
    if(a.effect==='rage')addR(a.rageAmt,a.name);
    else if(a.effect==='lightning'){regHit();log.push({t:'event',a:`⚡ ${a.name}`});byT.lightning.forEach(eff);}
    else if(a.effect==='magic_knife'){const times=knifeDouble?2:1;for(let mk=0;mk<times;mk++){regHit();log.push({t:'event',a:`🗡 ${a.name}${knifeDouble?' ×2':''}`});byT.magic_knife.forEach(eff);}}
    else if(a.effect==='heal'){log.push({t:'event',a:`💚 ${a.name}`});byT.heal.forEach(eff);}
    else if(a.effect==='shield'){shGained++;sh++;log.push({t:'event',a:`🛡 ${a.name}`});byT.shield.forEach(eff);}
  }
  function doRA(){rage-=100;ra++;regHit();log.push({t:'ra',a:`⚔ Rage Attack #${ra}${isAOE?' (AOE)':''}`,r:rage});if(isAOE)dmgAOE(aoeDmgPerRA);else dmg(100);byT.rage.forEach(eff);}

  if(turnNum===1&&byT.first_turn.length){log.push({t:'header',a:'First Turn'});byT.first_turn.forEach(eff);}
  if(byT.turn_start.length){
    byT.turn_start.forEach(a=>{
      if(a.onlyTurn&&turnNum!==a.onlyTurn)return;
      const times=a.effCount||1;
      log.push({t:'header',a:`Turn Start — ${a.name}${times>1?' ×'+times:''}`});
      for(let i=0;i<times;i++)eff(a);
    });
  }
  byT.turn_count.forEach(a=>{if(turnNum%(a.turnN||3)===0){log.push({t:'header',a:`Turn ${turnNum} trigger`});eff(a);}});
  if(rage>=100)doRA();

  for(let b=0;b<numBasics;b++){
    const isDodged=dodgeFirstAtk&&turnNum===1&&b===0;
    if(isDodged){
      log.push({t:'header',a:`Basic Attack — DODGED! (0 dmg, but +${baseR} rage, on-attack fires)`});
      regHit();addR(baseR,'Basic attack (dodged)');byT.attack.forEach(eff);
    }else{
      log.push({t:'header',a:`Basic Attack (+${baseR} rage, 40 dmg)`});
      regHit();dmg(40);addR(baseR,'Basic attack');byT.attack.forEach(eff);
    }
  }
  return{rage,eHp:eLeft>0?eHp:0,eLeft,sh,ra,kills,shGained,hitCount,totalR,log};
}

function simCombat(numE,startR,abs,dodgeFirst,rasPerKill,ignoreKills,oneShot,isAOE,optGoal){
  const turns=[];const enemyMaxHp=100*(rasPerKill||1);
  let rage=startR,enemies=numE,eHp=enemyMaxHp,pHp=100,shields=0;
  for(let t=1;t<=30;t++){
    if(enemies<=0||pHp<=0)break;
    const dodge=dodgeFirst&&t===1;
    const r=simTurn(rage,abs,t,eHp,enemies,shields,dodge,enemyMaxHp,ignoreKills,isAOE);
    let dmgTk=0,blocked=0,endSh=r.sh,shieldWin=false;
    if(r.eLeft>0){
      const shieldGoal=optGoal==='clearShield';
      if(oneShot||shieldGoal){
        if(shieldGoal&&r.eLeft===1&&endSh>0){
          // Shield absorbs the last hit — count as win, stop combat
          endSh=0;blocked=1;shieldWin=true;
        }else{
          pHp=0;dmgTk=100;
        }
      }else if(endSh>0){
        endSh=0;blocked=1;
        for(let h=1;h<r.eLeft;h++){dmgTk+=35;}
      }else{
        for(let h=0;h<r.eLeft;h++){dmgTk+=35;}
      }
    }
    pHp=Math.max(0,pHp-dmgTk);
    turns.push({turn:t,startR:rage,endR:r.rage,ra:r.ra,kills:r.kills,totalR:r.totalR,shG:r.shGained,blocked,eLeft:shieldWin?0:r.eLeft,eHp:r.eHp,dmg:dmgTk,hp:pHp,sh:endSh,died:pHp<=0,shieldWin,log:t===1?r.log:null});
    rage=r.rage;enemies=r.eLeft;eHp=r.eHp;shields=endSh;
    if(pHp<=0||shieldWin)break;
  }
  return turns;
}

function scoreTurns(turns,optGoal){
  const tRA=turns.reduce((s,t)=>s+t.ra,0),tS=turns.reduce((s,t)=>s+t.shG,0),tK=turns.reduce((s,t)=>s+t.kills,0);
  const last=turns[turns.length-1]||{};const died=!!last.died,cleared=(last.eLeft||0)===0&&!died;
  const shieldSurvive=!!last.shieldWin;
  const win=cleared||shieldSurvive;
  const fHp=died?0:(last.hp??100);
  const t1RA=(turns[0]||{}).ra||0;
  const avgRA=turns.length>0?tRA/turns.length:0;
  if(optGoal==='maxRA'){
    return t1RA*100000+Math.round(avgRA*10000)+tRA*100+(cleared?50000:0)+fHp;
  }
  if(optGoal==='twoRA'){
    const t1Score=t1RA>=2?10000000+(t1RA*100000):t1RA*100000;
    return t1Score+(cleared?50000:0)+tRA*100+fHp;
  }
  if(died)return-1000000+tRA*1000+tS;
  if(win)return 10000000+tRA*1000+fHp*100+tS+(last.sh||0)*500;
  return tK*100000+tRA*1000+fHp*100+tS;
}

function optimize(){
  const enemies=4;
  const dodgeFirst=false;
  const ignoreKills=true;
  const oneShot=true;
  const optGoal='maxRA';
  const priority2RA=false;
  const rasPerKill=1;
  const wantDodgeSafe=document.getElementById('avoidNoHit')?.checked||false;
  const listDiv=document.getElementById('buildsList');

  const isRiskyOnHit=k=>{const t=AB[k];if(!t)return false;if(t.trigger!=='hit')return false;return t.effect!=='lightning';};
  const isRageUseful=a=>{const t=AB[a.k];if(!t)return false;return!t.noImpact&&t.effect!=='none'&&t.effect!=='shield';};
  const itemHasOnHit=it=>getItemAbs(it).some(a=>{const t=AB[a.k];return t&&t.trigger==='hit'&&t.effect!=='lightning';});
  const shrineAbs=k=>{const t=AB[k];if(!t)return null;return{name:t.name+' (vending)',trigger:t.trigger,effect:t.effect,rageAmt:t.defR,hitN:t.hitN,turnN:t.turnN,every:t.every,onlyTurn:t.onlyTurn,effCount:t.effCount,noImpact:t.noImpact};};

  // Show searching...
  listDiv.innerHTML='<div class="empty" style="padding:1.5rem;text-align:center;color:var(--text-dim)">Searching…</div>';

  setTimeout(()=>{
    // Collect infinite builds across all forced-empty configurations
    const foundBuilds=[]; // {gear, shrineKeys, t1RA, forcedEmpty}
    const seen=new Set(); // dedupe by gear+shrine signature

    const passesToRun=wantDodgeSafe?[true, false]:[false];
    for(const avoidNoHit of passesToRun){
      // If dodge-safe first pass found builds, don't run fallback
      if(!avoidNoHit && foundBuilds.length>0) break;

      // Build shrine combos respecting user's manual picks
      const shrineCombos=[];
      function buildShrineCombos(idx,current){
        if(idx>=shrinePlan.length){shrineCombos.push(current.slice());return;}
        const shrine=shrinePlan[idx];
        const manualChoice=document.getElementById('shrineChoice'+idx);
        if(manualChoice&&manualChoice.value){current.push(manualChoice.value);buildShrineCombos(idx+1,current);current.pop();}
        else{
          let opts=shrine.opts.filter(Boolean);
          if(avoidNoHit)opts=opts.filter(k=>!isRiskyOnHit(k));
          if(opts.length===0){current.push(null);buildShrineCombos(idx+1,current);current.pop();}
          else{
            opts.forEach(k=>{current.push(k);buildShrineCombos(idx+1,current);current.pop();});
            current.push(null);buildShrineCombos(idx+1,current);current.pop();
          }
        }
      }
      buildShrineCombos(0,[]);
      if(shrineCombos.length===0)shrineCombos.push([]);

      // Try each poison-slot config: null (no restriction), helm, neck, ring, ring+weapon
      const configsToTry=[null,'helm','neck','ring','ring+weapon'];
      for(const forceEmpty of configsToTry){
        const forcedSlots=forceEmpty?forceEmpty.split('+'):[];
        const slotItems=SLOTS.map(s=>{
          if(checkerLocked[s.id]&&checkerGear[s.id]){
            const locked=ITEM_DB[s.id].find(i=>i.name===checkerGear[s.id]);
            if(locked)return[locked];
          }
          if(forcedSlots.includes(s.id)){
            const empty=ITEM_DB[s.id].find(i=>i.abs.length===0);
            return empty?[empty]:[null];
          }
          let items=ITEM_DB[s.id].length>0?ITEM_DB[s.id]:[null];
          if(avoidNoHit)items=items.filter(it=>!it||it.abs.length===0||!itemHasOnHit(it));
          const useful=items.filter(it=>!it||it.abs.length===0||getItemAbs(it).some(isRageUseful));
          return useful.length>0?useful:items;
        });

        for(const shrineKeys of shrineCombos){
          const sAbs=shrineKeys.filter(Boolean).map(shrineAbs).filter(Boolean);
          function combine(idx,cur){
            if(idx===SLOTS.length){
              const gAbs=[];cur.forEach(it=>{if(!it)return;getItemAbs(it).forEach(a=>{const t=AB[a.k];if(!t)return;gAbs.push({name:it.name,trigger:t.trigger,effect:t.effect,rageAmt:a.r||t.defR,hitN:a.hitN||t.hitN,turnN:a.turnN||t.turnN,every:t.every,onlyTurn:t.onlyTurn,effCount:t.effCount,noImpact:t.noImpact});});});
              const turns=simCombat(enemies,0,[...gAbs,...sAbs],dodgeFirst,rasPerKill,ignoreKills,oneShot,priority2RA,optGoal);
              const t1RA=(turns[0]||{}).ra||0;
              if(t1RA>=30){
                // Canonicalize: if a slot's item isn't actually load-bearing for THIS
                // ability combo (removing it still hits the threshold), treat it as
                // free/"Any X" rather than a specific flavor item, so it merges with
                // other builds that just happened to use a different unused item there.
                const finalGear=cur.slice();
                let workingAbs=gAbs;
                SLOTS.forEach((s,si)=>{
                  if(forcedSlots.includes(s.id))return; // already canonical empty
                  if(checkerLocked[s.id]&&checkerGear[s.id])return; // user explicitly locked this
                  const it=finalGear[si];
                  if(!it)return;
                  const candidateAbs=workingAbs.filter(a=>a.name!==it.name);
                  const turns2=simCombat(enemies,0,[...candidateAbs,...sAbs],dodgeFirst,rasPerKill,ignoreKills,oneShot,priority2RA,optGoal);
                  const ra2=(turns2[0]||{}).ra||0;
                  if(ra2>=30){finalGear[si]=null;workingAbs=candidateAbs;}
                });
                // Signature for dedupe
                const gearNames=finalGear.map(it=>it?it.name:'—').join('|');
                const shrineSig=[...shrineKeys].sort().join('|');
                const sig=gearNames+'||'+shrineSig+'||'+(forceEmpty||'');
                if(!seen.has(sig)){
                  seen.add(sig);
                  foundBuilds.push({gear:finalGear,shrineKeys:shrineKeys.slice(),t1RA,forcedEmpty:forceEmpty,turns});
                }
              }
              return;
            }
            for(const it of slotItems[idx]){cur.push(it);combine(idx+1,cur);cur.pop();}
          }
          combine(0,[]);
        }
      }
    } // end pass loop

    // Categorize builds into tiers
    let tierOver9000=[];    // ring+weapon both empty
    let tierPoisonSafe=[];  // any of helm/neck/ring empty (but not both ring+weapon)
    let tierPlain=[];       // no forced empty slot (or forced slot didn't provide poison safety)

    for(const b of foundBuilds){
      if(b.forcedEmpty==='ring+weapon') tierOver9000.push(b);
      else if(b.forcedEmpty && ['helm','neck','ring'].includes(b.forcedEmpty)) tierPoisonSafe.push(b);
      else tierPlain.push(b);
    }

    // Sort each tier: fewest active vending abilities first (fewer animations = faster
    // clears), then by RA descending as a tiebreaker.
    const abilityCount=b=>b.shrineKeys.filter(Boolean).length;
    const sortDesc=(a,b)=>abilityCount(a)-abilityCount(b)||b.t1RA-a.t1RA;
    tierOver9000.sort(sortDesc);
    tierPoisonSafe.sort(sortDesc);
    tierPlain.sort(sortDesc);

    // Dedupe by gear combination: the same item set reached via different vending
    // ability picks is the same build to the player, so keep only the best-ranked
    // (leanest/highest-RA, since arrays are already sorted) instance per item set.
    const gearSig=b=>b.gear.map(it=>it?it.name:'—').join('|');
    function dedupeByGear(arr){
      const seenGear=new Set();
      return arr.filter(b=>{
        const sig=gearSig(b);
        if(seenGear.has(sig))return false;
        seenGear.add(sig);
        return true;
      });
    }
    tierOver9000=dedupeByGear(tierOver9000);
    tierPoisonSafe=dedupeByGear(tierPoisonSafe);
    tierPlain=dedupeByGear(tierPlain);

    // Drop builds that are strictly more specific than another build already in the
    // list — e.g. if one build shows "Any Weapon" with everything else identical,
    // a variant naming one particular weapon adds nothing and gets removed.
    const slotVal=it=>(!it||it.abs.length===0)?null:it.name;
    function subsumes(a,b){ // does a (more general) make b redundant?
      let moreGeneral=false;
      for(let i=0;i<a.gear.length;i++){
        const ai=slotVal(a.gear[i]),bi=slotVal(b.gear[i]);
        if(ai===null){ if(bi!==null)moreGeneral=true; }
        else if(ai!==bi) return false;
      }
      return moreGeneral;
    }
    function removeSubsumed(arr){
      return arr.filter(b=>!arr.some(a=>a!==b&&subsumes(a,b)));
    }
    tierOver9000=removeSubsumed(tierOver9000);
    tierPoisonSafe=removeSubsumed(tierPoisonSafe);
    tierPlain=removeSubsumed(tierPlain);

    // Group by weapon slot (index 3 in SLOTS), keep top 3 per weapon
    function groupByWeapon(builds){
      const groups={};
      const order=[];
      for(const b of builds){
        const w=b.gear[3];
        const key=w?w.name:'— No Weapon —';
        if(!groups[key]){groups[key]=[]; order.push(key);}
        if(groups[key].length<3)groups[key].push(b);
      }
      // Flatten in order
      const out=[];
      for(const k of order){out.push(...groups[k]);}
      return out;
    }

    const top9000=groupByWeapon(tierOver9000);
    // Poison: split by slot first, then group each slot by weapon (top 3)
    const topPoisonBySlot={helm:[],neck:[],ring:[]};
    for(const slotKey of ['helm','neck','ring']){
      const bySlot=tierPoisonSafe.filter(b=>b.forcedEmpty===slotKey);
      topPoisonBySlot[slotKey]=groupByWeapon(bySlot);
    }
    const anyPoisonBuilds=Object.values(topPoisonBySlot).some(a=>a.length>0);
    // Only show plain infinite if no better tier has any builds
    const topPlain=(top9000.length>0||anyPoisonBuilds)?[]:groupByWeapon(tierPlain);

    // Render
    if(top9000.length===0 && !anyPoisonBuilds && topPlain.length===0){
      listDiv.innerHTML='<div class="empty" style="padding:1.5rem;text-align:center;color:var(--text-dim);font-style:italic">No infinite builds possible with current vending machines. Try adding more options or different abilities.</div>';
      return;
    }

    const slotIcons={helm:'🪖',chest:'🛡',neck:'🔱',weapon:'⚔',ring:'💍',belt:'👑'};
    function renderBuild(build, tier){
      const borderColor=tier==='over9000'?'#e84030':tier==='poison'?'#3ec070':'#999';
      const tierLabel=tier==='over9000'?'⚡ Over 9000':tier==='poison'?'✓ Poison Cleanse':'∞ Infinite';
      const tierColor=tier==='over9000'?'#e84030':tier==='poison'?'#2fb050':'#666';

      // Compact gear list
      const gearParts=build.gear.map((it,i)=>{
        const slot=SLOTS[i];
        const isEmpty=!it||it.abs.length===0;
        const name=isEmpty?`Any ${slot.name}`:it.name;
        return`<span style="display:inline-flex;align-items:center;gap:.2rem;font-size:.72rem;padding:.15rem .35rem;background:${isEmpty?'#f4e8c0':'#fff'};border-radius:4px;border:1px solid #ddd;color:${isEmpty?'#888':'#222'};font-style:${isEmpty?'italic':'normal'}"><span style="font-size:.85em">${slot.icon}</span>${name}</span>`;
      }).join(' ');

      // Vending abilities used
      const vendPills=build.shrineKeys.filter(Boolean).map(k=>{
        const t=AB[k];if(!t)return'';
        return`<span class="ability-tag" style="font-size:.65rem;padding:2px 7px 2px 3px">${icoFor(t.effect)}<span>${t.name}</span></span>`;
      }).join(' ');

      // Poison note (which slot is free)
      let poisonNote='';
      if(build.forcedEmpty){
        const slotLabel={helm:'Helm',neck:'Neck',ring:'Ring','ring+weapon':'Ring + Weapon'};
        poisonNote=`<span style="font-size:.7rem;color:${tierColor};font-weight:700;margin-left:.4rem">🧪 ${slotLabel[build.forcedEmpty]} free</span>`;
      }

      return`<div style="border:2px solid ${borderColor};border-radius:10px;padding:.55rem .7rem;margin-bottom:.5rem;background:#fdfaf3">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
            <span style="font-size:.72rem;font-weight:700;color:${tierColor};letter-spacing:.03em">${tierLabel}</span>
            ${poisonNote}
          </div>
          <span style="font-size:.85rem;font-weight:700;color:${tierColor}">${build.t1RA} RAs</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:.35rem">${gearParts}</div>
        ${vendPills?`<div style="display:flex;flex-wrap:wrap;gap:.2rem">${vendPills}</div>`:''}
      </div>`;
    }

    // Helper: render a group of builds sharing the same vending picks
    function renderVendingGroup(builds, tier){
      if(builds.length===0)return '';
      const borderColor=tier==='over9000'?'#e84030':tier==='poison'?'#3ec070':'#999';
      const tierColor=tier==='over9000'?'#e84030':tier==='poison'?'#2fb050':'#666';
      const tierLabel=tier==='over9000'?'⚡ OVER 9000':tier==='poison'?'✓ INFINITE + POISON CLEANSE':'∞ INFINITE';

      // Vending pills
      const vendPills=builds[0].shrineKeys.filter(Boolean).map(k=>{
        const t=AB[k];if(!t)return'';
        return`<span class="ability-tag" style="font-size:.65rem;padding:2px 7px 2px 3px">${icoFor(t.effect)}<span>${t.name}</span></span>`;
      }).join(' ');

      // Poison cleanse note — only show the "no slot free" case; the free-slot
      // case is already conveyed by the section header (e.g. "— HELM")
      let poisonNote='';
      if(!builds[0].forcedEmpty&&tier==='plain'){
        poisonNote=`<span style="font-size:.7rem;color:var(--text-dim);font-weight:700">No slot free for poison cleanse</span>`;
      }

      // Row renderer for a single item slot — item can be a single item, null (any),
      // or an array of interchangeable alternative items for that slot.
      function itemRow(itemOrList, slot){
        const list=Array.isArray(itemOrList)?itemOrList:[itemOrList];
        const isEmpty=list.every(item=>!item||item.abs.length===0);
        const name=isEmpty?`Any ${slot.name}`:list.filter(item=>item&&item.abs.length>0).map(item=>item.name).join(' / ');
        return`<div style="display:flex;align-items:center;gap:.35rem;padding:.25rem .5rem;background:${isEmpty?'#f4e8c0':'#fff'};border-radius:5px;border:1px solid #ddd;color:${isEmpty?'#888':'#222'};font-style:${isEmpty?'italic':'normal'};font-size:.75rem;white-space:nowrap"><span style="font-size:.9em">${slot.icon}</span>${name}</div>`;
      }

      // Merge builds that are identical in every slot except one, into a single
      // card listing the interchangeable alternatives for that slot (e.g. "Seething
      // Sash / Volatile Sash") instead of repeating an otherwise-identical build.
      const slotVal=it=>(!it||it.abs.length===0)?null:it.name;
      function clusterBuilds(list){
        const remaining=list.slice();
        const clusters=[];
        while(remaining.length){
          const first=remaining.shift();
          const slots=first.gear.map(it=>[it]); // per-slot list of alternatives
          const toRemove=[];
          for(let i=0;i<remaining.length;i++){
            const other=remaining[i];
            let diffSlot=-1,diffCount=0;
            for(let s=0;s<6;s++){
              if(slotVal(slots[s][0])!==slotVal(other.gear[s])){diffCount++;diffSlot=s;}
            }
            if(diffCount===1){
              if(!slots[diffSlot].some(it=>slotVal(it)===slotVal(other.gear[diffSlot])))slots[diffSlot].push(other.gear[diffSlot]);
              toRemove.push(i);
            }
          }
          for(let i=toRemove.length-1;i>=0;i--)remaining.splice(toRemove[i],1);
          clusters.push(slots);
        }
        return clusters;
      }

      // Each merged build cluster gets its own box with all slots stacked vertically
      const buildBoxes=clusterBuilds(builds).map(slots=>{
        const rows=SLOTS.map((slot,i)=>itemRow(slots[i],slot)).join('');
        return`<div style="min-width:180px;padding:.4rem .55rem;background:#f8f2df;border:1.5px dashed #d0c0a0;border-radius:6px;display:flex;flex-direction:column;gap:.25rem">
          ${rows}
        </div>`;
      }).join('');

      return`<div style="border:2px solid ${borderColor};border-radius:10px;padding:.55rem .7rem;margin-bottom:.6rem;background:#fdfaf3">
        <div style="display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.5rem;padding-bottom:.4rem;border-bottom:1px dashed #d0c0a0">
          ${vendPills}
          ${poisonNote}
        </div>
        <div style="display:flex;gap:.6rem;align-items:stretch;flex-wrap:wrap">
          ${buildBoxes}
        </div>
      </div>`;
    }

    // Render just gear (vending shown at group header)
    function renderBuildGearOnly(build, tier){
      const borderColor=tier==='over9000'?'#e84030':tier==='poison'?'#3ec070':'#999';
      const tierColor=tier==='over9000'?'#e84030':tier==='poison'?'#2fb050':'#666';
      const gearParts=build.gear.map((it,i)=>{
        const slot=SLOTS[i];
        const isEmpty=!it||it.abs.length===0;
        const name=isEmpty?`Any ${slot.name}`:it.name;
        return`<span style="display:inline-flex;align-items:center;gap:.2rem;font-size:.72rem;padding:.15rem .35rem;background:${isEmpty?'#f4e8c0':'#fff'};border-radius:4px;border:1px solid #ddd;color:${isEmpty?'#888':'#222'};font-style:${isEmpty?'italic':'normal'}"><span style="font-size:.85em">${slot.icon}</span>${name}</span>`;
      }).join(' ');
      return`<div style="border:2px solid ${borderColor};border-radius:8px;padding:.4rem .55rem;margin-bottom:.35rem;background:#fdfaf3;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap">
        <div style="display:flex;flex-wrap:wrap;gap:.25rem;flex:1">${gearParts}</div>
        <span style="font-size:.8rem;font-weight:700;color:${tierColor};white-space:nowrap">${build.t1RA} RAs</span>
      </div>`;
    }

    // Given a list of builds, group by unique vending picks (shrineKeys sorted) and render
    function renderBuildsGroupedByVending(builds, tier){
      const groups=new Map();
      for(const b of builds){
        const key=[...b.shrineKeys].filter(Boolean).sort().join('|');
        if(!groups.has(key))groups.set(key,[]);
        groups.get(key).push(b);
      }
      // Render each vending group
      let out='';
      for(const groupBuilds of groups.values()){
        out += renderVendingGroup(groupBuilds, tier);
      }
      return out;
    }

    let html='';
    if(top9000.length>0){
      html+='<div style="font-size:.72rem;font-weight:700;color:#e84030;letter-spacing:.08em;margin:.3rem 0 .3rem">⚡ OVER 9000</div>';
      html+=renderBuildsGroupedByVending(top9000,'over9000');
    }
    if(anyPoisonBuilds){
      const slotOrder=['helm','neck','ring'];
      const slotLabels={helm:'HELM',neck:'NECK',ring:'RING'};
      for(const slotKey of slotOrder){
        const bySlot=topPoisonBySlot[slotKey];
        if(bySlot.length===0)continue;
        html+=`<div style="font-size:.72rem;font-weight:700;color:#2fb050;letter-spacing:.08em;margin:.6rem 0 .3rem">✓ INFINITE + POISON CLEANSE — ${slotLabels[slotKey]}</div>`;
        html+=renderBuildsGroupedByVending(bySlot,'poison');
      }
    }
    if(topPlain.length>0){
      html+='<div style="font-size:.72rem;font-weight:700;color:#666;letter-spacing:.08em;margin:.6rem 0 .3rem">∞ INFINITE</div>';
      html+=renderBuildsGroupedByVending(topPlain,'plain');
    }

    listDiv.innerHTML=html;
  },30); // setTimeout so "Searching…" renders first
}


// ======== VENDING IMPORT ========
function importShrines(){
  const text=document.getElementById('shrineImportText').value;
  const msg=document.getElementById('shrineImportMsg');

  // Always skip these even if recognised
  const SKIP=new Set(['strike_twice','shield_on_kill','lightning_on_kill','shield_on_rage','shield_on_hit_5','shield_on_turn_4','shield_if_low','two_for_two_lightning']);

  // Ability text → key lookup
  const MAP={
    'r on h':'rage_on_heal','r on heal':'rage_on_heal',
    'r on hit 5':'rage_on_hit_5',
    'r on l':'rage_on_lightning','r on lightning':'rage_on_lightning',
    'r on mk':'rage_on_magic_knife','r on magic knife':'rage_on_magic_knife',
    '+r on atk':'bonus_rage_on_attack',
    'r on 1st turn':'rage_on_first_turn','r on first turn':'rage_on_first_turn',
    'r on kill':'rage_on_kill','r on enemy death':'rage_on_kill',
    'l on r':'bolt_on_rage','bolt on rage':'bolt_on_rage',
    '2 for 2 l':'two_for_two_lightning','two for two':'two_for_two_lightning',
    'l on atk':'lightning_on_attack','l on attack':'lightning_on_attack',
    'l every 5 hits':'lightning_every_5_hits','l every 5':'lightning_every_5_hits',
    'l on hit 4':'lightning_on_hit_4',
    'l on kill':'lightning_on_kill','l on enemy death':'lightning_on_kill',
    'l on turn start':'lightning_on_turn_start',
    'l on s':'lightning_on_shield','l on shield':'lightning_on_shield',
    'mk':'magic_knife_on_attack','mk on atk':'magic_knife_on_attack','mk on attack':'magic_knife_on_attack',
    'mk on r':'magic_knife_on_rage','mk on rage':'magic_knife_on_rage',
    'mk every 3 turns':'magic_knife_every_3_turns',
    'mk on hit 2':'magic_knife_on_hit_2',
    'mk on kill':'magic_knife_on_kill','mk on enemy death':'magic_knife_on_kill',
    'mk on crit':'magic_knife_on_crit',
    'h on l':'heal_on_lightning','h on lightning':'heal_on_lightning',
    'h on mk':'heal_on_magic_knife','h on magic knife':'heal_on_magic_knife',
    'h on r':'heal_on_rage','h on rage':'heal_on_rage',
    'h on 1st turn':'heal_on_first_turn','h on first turn':'heal_on_first_turn',
    'h on kill':'heal_on_kill','h on enemy death':'heal_on_kill',
    'h on hit 3':'heal_on_hit_3',
    's on kill':'shield_on_kill','s on enemy death':'shield_on_kill',
    's on hit 5':'shield_on_hit_5','s on turn 4':'shield_on_turn_4',
    's on r':'shield_on_rage','s on rage':'shield_on_rage','s if low':'shield_if_low',
    'strike twice':'strike_twice','strike twice every other':'strike_twice',
    'life steal':'life_steal','life steal on atk':'life_steal',
    'low hp def boost':'low_hp_defence',
    'crit up low hp':'crit_up_max_hp','crit up if max hp':'crit_up_max_hp',
    'second wind':'second_wind','fill r on low hp':'fill_rage_low_hp',
  };

  function parseAbility(raw){
    const s=raw.toLowerCase().trim().replace(/[()]/g,'');
    let key=MAP[s];
    if(!key){for(const [k,v] of Object.entries(MAP)){if(s===k||(s.length>2&&(s.includes(k)||k.includes(s)))){key=v;break;}}}
    if(!key||SKIP.has(key))return null;
    return key;
  }

  // Parse each M line — handles both formats:
  // M1: Floor 6(ability1, ability2) and M1- ability1, ability2
  const lines=text.split('\n');
  const shrines=[];
  for(const line of lines){
    // Try format with parentheses: M1: Floor 6(...)
    let m=line.match(/m(\d+)\s*[:\-].*?\(([^)]+)\)/i);
    if(!m){
      // Try format without parentheses: M1- ability1, ability2, ability3
      m=line.match(/m(\d+)\s*[:\-]\s*(.+)/i);
      // Skip if it looks like a vault/floor line
      if(m&&/fl\d+|vault|floor|luminite|coins/i.test(m[2]))m=null;
    }
    if(!m)continue;
    const idx=parseInt(m[1])-1;
    const parts=m[2].split(',').map(s=>s.trim());
    const opts=parts.map(parseAbility).filter(Boolean).slice(0,3);
    while(opts.length<3)opts.push('');
    shrines[idx]={opts};
  }

  if(shrines.length===0){msg.textContent='⚠ No M1/M2... lines found';return;}

  // Fill gaps
  // Pad up to 8 vending machines
  const target=8;
  for(let i=0;i<target;i++)if(!shrines[i])shrines[i]={opts:['','','']};
  const filled=shrines.filter(s=>s.opts.some(Boolean)).length;

  // Apply
  shrinePlan=shrines.slice(0,target);
  renderShrinePlanner();
  simulate();
  document.getElementById('shrineImportBox').style.display='none';
  msg.textContent=`✓ Imported ${filled} vending machines`;
}

// ======== INIT ========
(function(){
  render();
  renderShrinePlanner();
})();
</script>
